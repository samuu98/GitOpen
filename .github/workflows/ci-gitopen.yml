name: CI GitOpen

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup

      - name: Analyze
        run: flutter analyze

  test-shard:
    name: test-shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup

      - name: Test
        shell: bash
        # `flutter test` prints a non-JSON "Resolving dependencies…" preamble to
        # stdout; keep only JSON event lines so the reporter can parse it. GitHub
        # runs bash with `pipefail`, so a real test failure still fails the step.
        run: |
          mapfile -d '' files < <(find test -type f -name '*_test.dart' -print0 | LC_ALL=C sort -z)
          shard=${{ matrix.shard }}
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 3 == shard )); then
              selected+=("${files[index]}")
            fi
          done
          ((${#selected[@]} > 0))
          printf '%s\n' "${selected[@]}" > shard-files.txt
          flutter test --machine --coverage "${selected[@]}" | grep '^{' > test-results.json

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.shard }}
          path: |
            test-results.json
            coverage/lcov.info
            shard-files.txt
          if-no-files-found: error

  report:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: test-shard-*
          path: shards

      - name: Verify shard file coverage
        shell: bash
        run: |
          find test -type f -name '*_test.dart' -print | LC_ALL=C sort > expected-files.txt
          for shard in 0 1 2; do
            cat "shards/test-shard-$shard/shard-files.txt"
          done | LC_ALL=C sort > actual-files.txt
          echo "Expected $(wc -l < expected-files.txt) files; assigned $(wc -l < actual-files.txt)"
          diff -u expected-files.txt actual-files.txt

      - name: Merge shard reports
        run: node scripts/ci/merge-reports.mjs shards 3

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: 'GitOpen Tests (ubuntu-latest)'
          path: 'test-results.json'
          reporter: 'flutter-json'

      - name: Convert coverage to Cobertura
        run: |
          pip install lcov_cobertura
          # Drop generated files from coverage (lcov_cobertura --excludes matches
          # the dotted package, not the filename, so filter the lcov directly).
          awk '/^SF:/{skip = ($0 ~ /\.g\.dart/)} !skip' coverage/lcov.info > coverage/lcov.clean.info
          lcov_cobertura coverage/lcov.clean.info -o coverage/cobertura.xml

      - name: Code coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: 'coverage/cobertura.xml'
          badge: true
          fail_below_min: false
          format: 'markdown'
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: 'both'
          # Thresholds: <good below>/<acceptable below>. Informational only —
          # set fail_below_min=true once a baseline is established.
          thresholds: '50 75'

      - name: Add coverage comment to PR
        # pull_request runs from forks intentionally receive a read-only token,
        # even when this workflow requests pull-requests: write. The summary is
        # still available in the job output; only same-repository PRs can post
        # the sticky comment.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          path: code-coverage-results.md

      # Mirrors the NE.* "check vulnerable packages" step: scan pubspec.lock
      # against the OSV database. Informational (continue-on-error); Linux-only.
      - name: Scan dependencies for vulnerabilities
        if: always()
        continue-on-error: true
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=pubspec.lock

  build-and-test:
    name: build-and-test (ubuntu-latest)
    needs: [analyze, test-shard, report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TEST_RESULT: ${{ needs['test-shard'].result }}
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          for result in "$ANALYZE_RESULT" "$TEST_RESULT" "$REPORT_RESULT"; do
            if [ "$result" != success ]; then
              echo "Gate failed or skipped: analyze=$ANALYZE_RESULT test=$TEST_RESULT report=$REPORT_RESULT"
              exit 1
            fi
          done

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup

      - name: Build Flutter (Windows)
        run: flutter build windows --release

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\windows\gitopen.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Flutter setup
        uses: ./.github/actions/flutter-setup

      - name: Build Flutter (Linux)
        run: flutter build linux --release
